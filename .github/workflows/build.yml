name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Keep the signing key identical between builds so new APKs install as updates.
      # Preferred: repository secret SIGNING_KEYSTORE_BASE64 (+ SIGNING_KEYSTORE_PASSWORD).
      # Fallback: a key generated once and kept in the Actions cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: app/carmusic.keystore
          key: carmusic-signing-key-v1
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/carmusic.keystore
          elif [ ! -f app/carmusic.keystore ]; then
            keytool -genkeypair -keystore app/carmusic.keystore -storepass android -keypass android \
              -alias carmusic -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CarMusic"
          fi
      - name: Build release APK
        env:
          CARMUSIC_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK with version
        run: cp app/build/outputs/apk/release/app-release.apk "CarMusic-1.2.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CarMusic-1.2.${{ github.run_number }}
          path: CarMusic-1.2.${{ github.run_number }}.apk
